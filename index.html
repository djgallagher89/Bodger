<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bodger Scorecard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="A scorecard app for tracking scores in the card game Bodger">
    <meta name="apple-mobile-web-app-title" content="Bodger">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./service-worker.js')
            .then(function() {
                console.log('Service Worker Registered');
            })
            .catch(function(error) {
                console.log('Service Worker registration failed:', error);
            });
        }
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="icon-192x192.png">
</head>
<body>
    <h1>Bodger Scorecard</h1>
    <div id="current-round">Bodger is: King</div>
    <table>
        <thead>
            <tr>
                <th>Round</th>
                <th><input type="text" id="player1" placeholder="Player 1"></th>
                <th><input type="text" id="player2" placeholder="Player 2"></th>
                <th><input type="text" id="player3" placeholder="Player 3"></th>
                <th><input type="text" id="player4" placeholder="Player 4"></th>
                <th><input type="text" id="player5" placeholder="Player 5"></th>
            </tr>
        </thead>
        <tbody>
            <tr><td>King</td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td></tr>
            <tr><td>Queen</td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td></tr>
            <tr><td>Jack</td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td></tr>
            <tr><td>10</td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td></tr>
            <tr><td>9</td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td></tr>
            <tr><td>8</td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td></tr>
            <tr><td>7</td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td></tr>
            <tr><td>6</td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td></tr>
            <tr><td>5</td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td></tr>
            <tr><td>4</td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td></tr>
            <tr><td>3</td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td></tr>
            <tr><td>2</td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td></tr>
            <tr><td>Ace</td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td><td><input type="number" min="0" class="score-input"></td></tr>
        </tbody>
        <tfoot>
            <tr>
                <th>Total</th>
                <td id="total-player1"></td>
                <td id="total-player2"></td>
                <td id="total-player3"></td>
                <td id="total-player4"></td>
                <td id="total-player5"></td>
            </tr>
        </tfoot>
    </table>
    <button id="reset-scores">Reset Scores</button>
<button id="next-round">Next Round</button>
   <button id="clear-all">Clear All Data</button> 
    <script src="script.js"></script>
</body>
</html>
